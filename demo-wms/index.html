<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo WMS — skenovanie</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: #1e293b;
        color: #fff;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      header .hint {
        font-size: 13px;
        color: #cbd5e1;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 20px;
        padding: 20px;
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      #direction-card {
        background: #fff;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 340px;
        border: 3px solid #e2e8f0;
        transition: background 0.2s;
        text-align: center;
        padding: 20px;
      }
      #direction-card.left {
        background: #fee2e2;
        border-color: #dc2626;
      }
      #direction-card.right {
        background: #dbeafe;
        border-color: #2563eb;
      }
      #direction-card.behind {
        background: #ffedd5;
        border-color: #ea580c;
      }
      #arrow {
        font-size: 120px;
        line-height: 1;
      }
      #side-label {
        font-size: 48px;
        font-weight: 800;
        margin-top: 8px;
      }
      #sku-label {
        font-size: 20px;
        color: #475569;
        margin-top: 12px;
        font-family: ui-monospace, monospace;
      }
      aside {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .panel {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid #e2e8f0;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      input[type='text'] {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-family: ui-monospace, monospace;
      }
      button {
        margin-top: 8px;
        width: 100%;
        padding: 10px;
        font-size: 15px;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        background: #1e293b;
        color: #fff;
        cursor: pointer;
      }
      select {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 14px;
      }
      label {
        font-size: 13px;
        color: #475569;
        display: block;
        margin-bottom: 4px;
      }
      #history {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 13px;
        max-height: 260px;
        overflow-y: auto;
      }
      #history li {
        padding: 6px 8px;
        border-radius: 6px;
        margin-bottom: 4px;
        background: #f8fafc;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      #history li.MATCH {
        background: #dcfce7;
      }
      #history li.MISMATCH {
        background: #fee2e2;
        font-weight: 700;
      }
      #history li.TIMEOUT {
        background: #fef9c3;
      }
      kbd {
        background: #334155;
        color: #fff;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Demo WMS — ukladanie produktov</h1>
      <div class="hint">
        Naskenuj kód (USB skener píše ako klávesnica) alebo stlač
        <kbd>F1</kbd> vľavo · <kbd>F2</kbd> vpravo · <kbd>F3</kbd> za seba
      </div>
    </header>
    <main>
      <section id="direction-card">
        <div id="arrow">⌛</div>
        <div id="side-label">Čakám na sken…</div>
        <div id="sku-label"></div>
      </section>
      <aside>
        <div class="panel">
          <h2>Manuálny sken</h2>
          <label for="sku-input">Kód produktu</label>
          <input id="sku-input" type="text" placeholder="napr. ABC123" autocomplete="off" />
          <button id="scan-btn">Skenovať</button>
        </div>
        <div class="panel">
          <h2>Nastavenie</h2>
          <label for="layout-select">Rozloženie lokácií</label>
          <select id="layout-select">
            <option value="L">Len vľavo</option>
            <option value="LR" selected>Vľavo + vpravo</option>
            <option value="LRB">Vľavo + vpravo + za sebou</option>
          </select>
        </div>
        <div class="panel">
          <h2>História kontrol</h2>
          <ul id="history"></ul>
        </div>
      </aside>
    </main>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
